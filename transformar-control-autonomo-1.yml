name: Preparar Control Autónomo 1.0.5
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Preparar privacidad y formas de cobro
        run: |
          python3 - <<'PYUPDATE'
          from pathlib import Path
          p=Path('tools/play-store/prepare.py');p.parent.mkdir(parents=True,exist_ok=True);p.write_text('from pathlib import Path\nimport re\n\nroot = Path(\'.\')\nassets = root / \'app/src/main/assets\'\nemail = \'raulito-sp@hotmail.com\'\nprivacy = \'\'\'<h2>Privacidad de Control Autónomo</h2><p>Actualizada: 4 de octubre de 2026.</p>\n<p>Responsable: Raúl Sánchez Perea. Contacto: raulito-sp@hotmail.com.</p>\n<h3>Datos y finalidad</h3><p>En modo local, los movimientos, caja/banco, nombre del negocio y ajustes se guardan en este dispositivo. Al crear una cuenta, Firebase Authentication gestiona el correo, las credenciales y el identificador de usuario. Al sincronizar, Firebase Cloud Firestore almacena tus movimientos, importes, conceptos, fechas, ajustes y revisiones para recuperar tu copia y usarla en otros dispositivos.</p>\n<p>La cuenta y la sincronización son opcionales. Tratamos estos datos para prestar el servicio que solicitas. Los mensajes de soporte se utilizan para atender tu consulta y comprobar la titularidad de una cuenta cuando solicitas su eliminación.</p>\n<h3>Proveedores y seguridad</h3><p>Usamos Firebase, de Google, para autenticación y almacenamiento. La base de datos de este proyecto está configurada en Europa (eur3). Firebase Authentication se presta desde Estados Unidos; las transferencias internacionales se rigen por las condiciones y garantías aplicables de Google. Firebase también trata direcciones IP y datos técnicos del navegador o dispositivo para prestar el servicio y prevenir abusos. Las comunicaciones con Firebase utilizan HTTPS. No incorporamos anuncios ni el SDK de Google Analytics a esta versión.</p>\n<p>La copia local se guarda en el almacenamiento de la aplicación; el PIN opcional es un bloqueo de acceso, no cifra los archivos. Protege tu dispositivo y las copias JSON o PDF que exportes. No incluyas información sensible de terceros en los conceptos si no es necesaria.</p>\n<p>Las páginas públicas de soporte y privacidad previstas se alojarán en GitHub Pages, cuyo proveedor puede registrar datos técnicos de las visitas, como la dirección IP, para servir las páginas y proteger su infraestructura.</p>\n<h3>Conservación y eliminación</h3><p>Los datos sincronizados permanecen hasta que solicites su eliminación. Puedes solicitar borrar la cuenta y todos sus datos de la nube escribiendo desde el correo de la cuenta a raulito-sp@hotmail.com con el asunto «Eliminar cuenta Control Autónomo». Verificaremos la titularidad y atenderemos la solicitud en un plazo de 30 días, salvo que exista una obligación legal de conservación, que te explicaremos.</p>\n<p>La solicitud se atiende manualmente. Abrir el correo o cerrar sesión no elimina datos. Los archivos que hayas exportado, compartido o guardado en otros dispositivos no se borran a distancia. Para eliminar las copias locales, borra el almacenamiento de la app en los ajustes de Android en cada dispositivo y elimina los archivos exportados que ya no quieras conservar.</p>\n<p>Según la documentación de Firebase, los registros de IP de Authentication se conservan unas semanas y la eliminación de información de autenticación de sus sistemas activos y copias internas puede tardar hasta 180 días después de solicitar el borrado. Los mensajes de soporte se conservan mientras se gestiona la consulta o solicitud y se eliminan después de cerrarla, salvo una obligación legal que te comunicaremos.</p>\n<h3>Tus derechos</h3><p>Puedes solicitar acceso, rectificación, supresión, portabilidad, oposición o limitación escribiendo al correo de contacto. También puedes presentar una reclamación ante la Agencia Española de Protección de Datos. Puedes exportar tus datos desde Ajustes. La app no está dirigida a menores.</p>\'\'\'\ndelete = \'\'\'<h2>Eliminar cuenta y datos de Control Autónomo</h2><p>Puedes solicitarlo aunque hayas desinstalado la aplicación.</p>\n<ol><li>Escribe desde el correo asociado a tu cuenta a <strong>raulito-sp@hotmail.com</strong>.</li><li>Usa el asunto <strong>Eliminar cuenta Control Autónomo</strong> y confirma que deseas borrar la cuenta y sus datos sincronizados.</li><li>Verificaremos que eres su titular y te confirmaremos la eliminación. El plazo de atención es de 30 días, salvo una obligación legal de conservación que te explicaremos.</li></ol>\n<p>Se eliminan el usuario de Firebase Authentication y sus datos de Firestore: movimientos, caja/banco, nombre del negocio, ajustes y copias sincronizadas asociadas. La solicitud se atiende manualmente: preparar o enviar el correo no produce un borrado automático.</p>\n<p>No envíes tu contraseña, documentos financieros ni copias de seguridad. No necesitas pagar ni reinstalar la app. Exporta antes lo que quieras conservar: la eliminación de la nube es definitiva.</p>\n<p>Los archivos exportados y las copias locales en tus dispositivos no se borran a distancia. Después de la confirmación, borra el almacenamiento de la app desde los ajustes de Android en cada dispositivo y elimina los archivos exportados que no desees conservar.</p>\n<p><a class="button" href="mailto:raulito-sp@hotmail.com?subject=Eliminar%20cuenta%20Control%20Aut%C3%B3nomo">Preparar correo de solicitud</a></p><p>Si el botón no abre tu correo, escribe manualmente a la dirección indicada. Debes enviar el mensaje para completar la solicitud.</p>\'\'\'\nstyle = \'body{font:17px/1.6 system-ui,sans-serif;margin:0;background:#f7f8fb;color:#141820}main{max-width:760px;margin:auto;padding:24px}a{color:#075eae;overflow-wrap:anywhere}.button{display:inline-block;padding:12px 18px;border-radius:12px;background:#1477f8;color:white}h1,h2,h3{line-height:1.25}nav{display:flex;gap:20px;flex-wrap:wrap}p,li{overflow-wrap:anywhere}\'\ndef page(title, body):\n    return \'<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>\'+title+\'</title><style>\'+style+\'</style></head><body><main><h1>Control Autónomo</h1><nav><a href="privacidad.html">Privacidad</a><a href="eliminar-cuenta.html">Eliminar cuenta</a></nav>\'+body+\'</main></body></html>\'\ndocs = root/\'docs\'\ndocs.mkdir(exist_ok=True)\n(docs/\'privacidad.html\').write_text(page(\'Privacidad · Control Autónomo\',privacy))\n(docs/\'eliminar-cuenta.html\').write_text(page(\'Eliminar cuenta · Control Autónomo\',delete))\n(docs/\'index.html\').write_text(page(\'Control Autónomo · Soporte\',\'<h2>Soporte</h2><p>Contacta con raulito-sp@hotmail.com para consultas sobre la aplicación.</p>\'))\n(docs/\'.nojekyll\').write_text(\'\')\n\np=assets/\'index.html\';s=p.read_text()\nif \'id="privacyDialog"\' not in s:\n    marker=\'<div class="section">Aplicación</div>\'\n    if marker not in s: raise SystemExit(\'No se encuentra la sección Aplicación.\')\n    s=s.replace(marker,marker+\'<button class="secondary" type="button" onclick="document.getElementById(\\\'privacyDialog\\\').showModal()">Privacidad y contacto</button><button class="secondary" type="button" onclick="document.getElementById(\\\'deleteAccountDialog\\\').showModal()">Solicitar eliminación de cuenta y datos</button>\',1)\n    dialogs=\'\'\n    for ident,body in [(\'privacyDialog\',privacy),(\'deleteAccountDialog\',delete)]:\n        dialogs+=\'<dialog id="\'+ident+\'" aria-label="\'+(\'Privacidad\' if ident==\'privacyDialog\' else \'Eliminar cuenta y datos\')+\'" style="border:0;border-radius:22px;width:min(92%,700px);padding:22px;max-height:85vh;overflow:auto">\'+body+\'<button class="secondary" type="button" onclick="this.closest(\\\'dialog\\\').close()">Cerrar</button></dialog>\'\n    s=s.replace(\'</body>\',dialogs+\'</body>\')\n    s=s.replace(\'</style>\', \'.app dialog p,.app dialog li,dialog p,dialog li{font-size:15px;line-height:1.6;overflow-wrap:anywhere}dialog a{color:#075eae;overflow-wrap:anywhere}</style>\',1)\nfor ident,body in [(\'privacyDialog\',privacy),(\'deleteAccountDialog\',delete)]:\n    pattern = r\'(<dialog id="\'+ident+r\'"[^>]*>).*?(<button class="secondary" type="button" onclick="this.closest.*?</dialog>)\'\n    s=re.sub(pattern,lambda m:m.group(1)+body+m.group(2),s,flags=re.S)\ns=s.replace(\'1.0.3\',\'1.0.4\');p.write_text(s)\np=assets/\'sw.js\';p.write_text(p.read_text().replace(\'v1.0.3\',\'v1.0.4\'))\n\np=root/\'app/src/main/java/com/miscuentas/pro/MainActivity.java\';s=p.read_text()\nmarker=\'                String url = request.getUrl().toString();\'\nif \'mailto:raulito-sp@hotmail.com\' not in s:\n    if marker not in s: raise SystemExit(\'No se encuentra la navegación de Android.\')\n    s=s.replace(marker,marker+\'\'\'\n                if (request.isForMainFrame() && (url.equals("mailto:raulito-sp@hotmail.com") || url.startsWith("mailto:raulito-sp@hotmail.com?"))) {\n                    try {\n                        startActivity(new Intent(Intent.ACTION_SENDTO, Uri.parse(url)));\n                    } catch (android.content.ActivityNotFoundException e) {\n                        new AlertDialog.Builder(MainActivity.this)\n                            .setMessage("Escribe a raulito-sp@hotmail.com desde tu correo. Asunto: Eliminar cuenta Control Autónomo.")\n                            .setPositiveButton("Aceptar", null).show();\n                    }\n                    return true;\n                }\n\'\'\',1)\n# Android 16 no longer dispatches the legacy Activity.onBackPressed override.\nmarker=\'        setContentView(webView);\'\nif \'registerOnBackInvokedCallback\' not in s:\n    s=s.replace(marker,marker+\'\'\'\n        if (Build.VERSION.SDK_INT >= 33) {\n            getOnBackInvokedDispatcher().registerOnBackInvokedCallback(\n                android.window.OnBackInvokedDispatcher.PRIORITY_DEFAULT,\n                this::onBackPressed\n            );\n        }\n\'\'\',1)\nmarker=\'"(function(){var o=document.getElementById(\\\'pdfPreviewOverlay\\\');"\'\nif \'dialog[open]\' not in s:\n    if marker not in s: raise SystemExit(\'No se encuentra el botón Atrás.\')\n    s=s.replace(marker,\'"(function(){var d=document.querySelector(\\\'dialog[open]\\\');if(d){d.close();return \\\'preview\\\';}var o=document.getElementById(\\\'pdfPreviewOverlay\\\');"\',1)\np.write_text(s)\n# Prevent Android cloud backup from copying financial data or login sessions.\np=root/\'app/src/main/AndroidManifest.xml\';p.write_text(p.read_text().replace(\'android:allowBackup="true"\',\'android:allowBackup="false"\'))\np=root/\'app/build.gradle\';s=p.read_text();s=s.replace(\'versionCode 4\',\'versionCode 5\').replace("versionName \'1.0.3\'","versionName \'1.0.4\'")\nif \'PLAY_STORE_FILE\' not in s:\n    s+=\'\'\'\n// Upload-key credentials come from the build environment, never from git.\nandroid {\n    signingConfigs {\n        release {\n            if (System.getenv(\'PLAY_STORE_FILE\')) {\n                storeFile file(System.getenv(\'PLAY_STORE_FILE\'))\n                storePassword System.getenv(\'PLAY_STORE_PASSWORD\')\n                keyAlias System.getenv(\'PLAY_KEY_ALIAS\')\n                keyPassword System.getenv(\'PLAY_KEY_PASSWORD\')\n            }\n        }\n    }\n    buildTypes {\n        release {\n            signingConfig signingConfigs.release\n            debuggable false\n        }\n    }\n}\n\'\'\'\np.write_text(s)\np=root/\'.gitignore\';s=p.read_text() if p.exists() else \'\'\nfor line in [\'*.jks\',\'*.keystore\']:\n    if line not in s:s+=\'\\n\'+line+\'\\n\'\np.write_text(s)\n')
          p=Path('tools/play-store/payments.py');p.parent.mkdir(parents=True,exist_ok=True);p.write_text('from pathlib import Path\nimport re\n\nassets=Path(\'app/src/main/assets\')\np=assets/\'index.html\';s=p.read_text()\nmatch=re.search(r\'<script>\\n(.*?)</script>\',s,re.S)\nif not match:raise SystemExit(\'No se encuentra el código de la aplicación.\')\ncore=match.group(1)\nif \'function paymentSummaryHTML\' not in core:\n    helper=\'\'\'function paymentSummaryHTML(movements,title=\'Cobrado por forma de pago\'){\n const totals=CAPayments.split(movements);\n return `<h3>${title}</h3><table class="reportTable"><tr><th>Forma de cobro</th><th>Importe (IVA incluido)</th></tr>${Object.entries(CAPayments.labels).map(([key,label])=>`<tr><td>${label}</td><td>${eur(totals[key])}</td></tr>`).join(\'\')}<tr><th>Total cobrado</th><th>${eur(totals.total)}</th></tr></table>${totals.unspecifiedCount?\'<p class="small">Los ingresos sin forma de cobro se muestran como Sin especificar. Puedes clasificarlos en Movimientos.</p>\':\'\'}`;\n}\nfunction selectedIncome(y,m){return data.movements.filter(x=>x.type===\'Ingreso\'&&Number(x.date.slice(0,4))===y&&(m==null||Number(x.date.slice(5,7))===m))}\nfunction reportedIncome(y,m){return selectedIncome(y,m).filter(x=>!data.nonworking.includes(x.date))}\nfunction setPaymentMethod(id,value){\n if(!Object.hasOwn(CAPayments.labels,value))return;\n const movement=data.movements.find(x=>x.id===id&&x.type===\'Ingreso\');if(!movement)return;\n const previous=movement.paymentMethod;movement.paymentMethod=value;\n try{save();const month=Number(movement.date.slice(5,7));if(document.getElementById(\'moves\').classList.contains(\'active\'))renderMonth(month);buildMonthlyReport()}catch(e){if(previous==null)delete movement.paymentMethod;else movement.paymentMethod=previous;render()}\n}\n\'\'\'\n    core=core.replace(\'function movementHTML(m){\',helper+\'function movementHTML(m){\',1)\n    old=\'${m.date}${cat?` · ${cat}`:""} · IVA ${m.vat||0}%\'\n    new=\'${m.date}${cat?` · ${cat}`:""} · IVA ${m.vat||0}%${m.type==="Ingreso"?` · ${CAPayments.labels[CAPayments.method(m)]}`:""}\'\n    if old not in core:raise SystemExit(\'No se encuentra el detalle de movimientos.\')\n    core=core.replace(old,new,1)\n    old=\'<div class="actions"><button class="tiny danger" onclick="deleteMove(${m.id})">Borrar</button></div>\'\n    new=\'\'\'${m.type==="Ingreso"?`<label class="small" for="payment-${m.id}">Forma de cobro</label><select id="payment-${m.id}" aria-label="Forma de cobro del ingreso ${m.id}" onchange="setPaymentMethod(${m.id},this.value)" style="font-size:14px;padding:8px;margin:4px 0">${Object.entries(CAPayments.labels).map(([key,label])=>`<option value="${key}" ${CAPayments.method(m)===key?\'selected\':\'\'}>${label}</option>`).join(\'\')}</select>`:\'\'}<div class="actions"><button class="tiny danger" onclick="deleteMove(${m.id})">Borrar</button></div>\'\'\'\n    if old not in core:raise SystemExit(\'No se encuentra la edición de movimientos.\')\n    core=core.replace(old,new,1)\n    core=core.replace(\'renderQuarters();renderCash();renderBenefits()\',"renderQuarters();renderCash();renderBenefits();document.getElementById(\'annualPayments\').innerHTML=paymentSummaryHTML(selectedIncome(y),\'Cobros del año \'+y)",1)\n    core=core.replace(\'function syncMovementForm(){let isExpense=type.value==="Gasto";\', \'function syncMovementForm(){let isExpense=type.value==="Gasto";document.getElementById("paymentFields").hidden=isExpense;\',1)\n    core=core.replace(\'type.value="Ingreso";vat.value=21;withholding.value=0;syncMovementForm();dlg.showModal()\', \'type.value="Ingreso";document.getElementById("paymentMethod").value="";vat.value=21;withholding.value=0;syncMovementForm();dlg.showModal()\',1)\n    start=core.index(\'function addMovement(){\');end=core.index(\'\\nfunction renderMonth\',start)\n    old=core[start:end]\n    new=old.replace(\'let isExpense=type.value==="Gasto",\', \'const paymentMethod=document.getElementById("paymentMethod").value;if(type.value==="Ingreso"&&!["cash","card","transfer"].includes(paymentMethod))return alert("Elige cómo has cobrado: efectivo, tarjeta o transferencia.");let isExpense=type.value==="Gasto",\')\n    new=new.replace(\'gestoria:false,category:c,\',\'gestoria:false,...(!isExpense?{paymentMethod}:{}),category:c,\')\n    core=core[:start]+new+core[end:]\n    core=core.replace(\'Beneficio neto estimado: ${eur(b.neto)}</b></div></div>`}\', \'Beneficio neto estimado: ${eur(b.neto)}</b></div></div>`+paymentSummaryHTML(selectedIncome(currentYear(),m))}\',1)\n    start=core.index(\'function renderCash(){\');end=core.index(\'\\nfunction monthlyIncomeRows\',start)\n    core=core[:start]+\'\'\'function renderCash(){\n const y=currentYear(),months=CAPayments.cashYear(data.movements,data.bank,y);\n cashSummary.innerHTML=months.map(r=>{\n const monthIncome=CAPayments.split(selectedIncome(y,r.month));\n return `<div class="panel"><b>${MONTHS[r.month-1]}</b><div class="small" style="line-height:1.8;margin-top:8px">Cobrado en efectivo: ${eur(monthIncome.cash)}<br>Cobrado con tarjeta: ${eur(r.card)}<br>Cobrado por transferencia: ${eur(r.transfer)}<br>Sin especificar: ${eur(r.unspecified)}<br>Efectivo llevado al banco: ${eur(r.deposit)}<br><b>${r.unknownCount?\'Caja provisional\':\'Caja acumulada\'}: ${eur(r.unknownCount?r.provisionalCash:r.cash)}</b>${r.unknownCount?`<br>Incluye ${eur(r.unknown)} sin forma de cobro asignada; clasifica esos ingresos para conocer el efectivo.`:\'\'}<br>Entradas brutas al banco acumuladas: ${eur(r.bankEntries)}</div></div>`;\n }).join(\'\');\n const deposited=data.bank.filter(x=>Number(x.date.slice(0,4))===y).map(x=>({...x,kind:\'deposit\'}));\n const direct=selectedIncome(y).filter(x=>[\'card\',\'transfer\'].includes(CAPayments.method(x))).map(x=>({...x,amount:x.total,kind:CAPayments.method(x)}));\n bankHistory.innerHTML=[...deposited,...direct].sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<div class="movement"><div class="ico">€</div><div><div class="mname">${x.kind===\'deposit\'?\'Efectivo llevado al banco\':CAPayments.labels[x.kind]+\' · cobro registrado\'}</div><div class="sub">${x.date}${x.kind===\'deposit\'?\'\':\' · Importe bruto; consulta el abono en tu banco\'}</div></div><div class="amt">${eur(x.amount)}<div>${x.kind===\'deposit\'?`<button class="tiny danger" onclick="deleteBank(${x.id})">Borrar</button>`:\'<span class="small">Se modifica desde Movimientos</span>\'}</div></div></div>`).join(\'\')||\'<div class="panel small">Sin entradas registradas al banco.</div>\';\n}\n\'\'\' + core[end:]\n    # Monthly report keeps the legible three-column tax table and adds a payment table.\n    core=core.replace(\'Efectivo + IVA\',\'Total (IVA incluido)\')\n    needle="${totalRow}</table>`;"\n    if needle not in core:raise SystemExit(\'No se encuentra el informe mensual.\')\n    core=core.replace(needle,"${totalRow}</table>`+paymentSummaryHTML(reportedIncome(y,m));",1)\n    needle=\' flush();\\n const enc=new TextEncoder();\'\n    if needle not in core:raise SystemExit(\'No se encuentra el generador de PDF.\')\n    addition=\'\'\' if(cy<190){flush();header()}\n cy-=34;add("Desglose por forma de cobro (IVA incluido)",45,11,true);cy-=22;\n const breakdown=CAPayments.split(reportedIncome(y,m));\n for(const [key,label] of Object.entries(CAPayments.labels)){add(label,45,10);add(eur(breakdown[key]),300,10);cy-=20}\n add("TOTAL COBRADO",45,10,true);add(eur(breakdown.total),300,10,true);cy-=20;\n flush();\n const enc=new TextEncoder();\'\'\'\n    core=core.replace(needle,addition,1)\n    # Preview uses exactly the same report as the screen and printing.\n    start=core.index(\'function viewMonthlyPDF(){\');end=core.index(\'\\nasync function blobToDataURL\',start)\n    core=core[:start]+\'\'\'function viewMonthlyPDF(){\n buildMonthlyReport();\n const old=document.getElementById(\'pdfPreviewOverlay\');if(old)old.remove();\n const o=document.createElement(\'div\');o.id=\'pdfPreviewOverlay\';o.style.cssText=\'position:fixed;inset:0;z-index:99999;background:#e9edf2;overflow:auto;padding:14px\';\n o.innerHTML=`<div style="max-width:820px;margin:0 auto"><div style="position:sticky;top:0;z-index:2;display:flex;gap:8px;padding:8px 0;background:#e9edf2"><button class="primary" style="flex:1" onclick="document.getElementById(\'pdfPreviewOverlay\').remove()">Volver</button><button class="secondary" style="flex:1" onclick="saveMonthlyPDF()">Guardar / compartir</button><button class="secondary" style="flex:1" onclick="printMonthlyReport()">Imprimir</button></div><div id="pdfPreviewPage" style="background:#fff;color:#111;min-height:75vh;padding:28px 20px">${document.getElementById(\'monthlyReport\').innerHTML}</div></div>`;\n document.body.appendChild(o);\n}\n\'\'\' +core[end:]\n    s=s[:match.start(1)]+core+s[match.end(1):]\n    s=s.replace(\'<script src="store.js"></script>\', \'<script src="store.js"></script><script src="payments.js"></script>\',1)\n    s=s.replace(\'<label>Concepto</label>\', \'<div id="paymentFields"><label for="paymentMethod">Forma de cobro</label><select id="paymentMethod"><option value="">Selecciona cómo has cobrado</option><option value="cash">Efectivo</option><option value="card">Tarjeta</option><option value="transfer">Transferencia</option></select></div><label>Concepto</label>\',1)\n    s=s.replace(\'<div class="panel"><b>Resumen trimestral</b>\', \'<div class="panel" id="annualPayments"></div><div class="panel"><b>Resumen trimestral</b>\',1)\n    s=s.replace(\'La caja se calcula con los ingresos registrados y se acumula mes a mes. Registra aquí lo que ingresas en el banco.\', \'La caja incluye los cobros en efectivo menos el efectivo llevado al banco. Tarjeta y transferencia figuran automáticamente como entradas al banco: no los añadas de nuevo aquí. Los importes son brutos y se muestran en la fecha del ingreso registrado; no representan el saldo real del banco ni descuentan comisiones o retenciones. La caja no descuenta gastos ni arrastra saldos del año anterior.\')\n    s=s.replace(\'placeholder="Importe ingresado en banco"\',\'placeholder="Efectivo que llevas al banco"\').replace(\'>Añadir ingreso al banco<\',\'>Registrar efectivo llevado al banco<\').replace(\'Historial de ingresos al banco\',\'Entradas registradas al banco\')\n    s=s.replace(\'La caja acumula los ingresos registrados menos las cantidades anotadas como ingresadas al banco, mes a mes dentro del año seleccionado. No descuenta gastos ni arrastra el saldo del año anterior. Si registras 500 € de ingresos y 200 € ingresados al banco, la caja muestra 300 €. El ingreso al banco no es una venta nueva. La app no se conecta con tu banco.\', \'La caja acumula los cobros en efectivo menos el efectivo llevado al banco dentro del año seleccionado. Tarjeta y transferencia aparecen como entradas al banco derivadas del ingreso original, sin duplicar ventas. La app no se conecta al banco, no calcula su saldo real ni descuenta comisiones o retenciones del abono. Los ingresos antiguos sin método conservan su importe y se muestran como Sin especificar; mientras existan, la caja se indica como provisional. Clasifícalos desde Movimientos. La caja no descuenta gastos ni arrastra el saldo del año anterior.\')\n    s=s.replace(\'En ingresos puedes indicar una retención.\', \'En ingresos elige Efectivo, Tarjeta o Transferencia y, si procede, indica una retención. Puedes cambiar la forma de cobro desde el movimiento sin borrarlo.\')\n    s=s.replace(\'Esta versión guarda los datos en este dispositivo, sin sincronización automática. Para trasladarlos, exporta una copia JSON e impórtala en el otro dispositivo.\', \'En modo local los datos permanecen en este dispositivo. Con una cuenta puedes sincronizarlos mediante Firebase y acceder con el mismo correo en otro dispositivo. Actualiza todos tus dispositivos para que muestren las mismas formas de cobro.\')\n    s=s.replace(\'</style>\', \'.movement>div{min-width:0}.payment-note{overflow-wrap:anywhere}</style>\',1)\n# Preserve all user records; add optional validation for the new metadata only.\np=assets/\'store.js\';store=p.read_text()\nmarker="if(m.withholding!=null&&!Number.isFinite(m.withholding))throw Error(\'Importe no válido\');"\nif \'Forma de cobro no válida\' not in store:\n    if marker not in store:raise SystemExit(\'No se encuentra la validación de copias.\')\n    store=store.replace(marker,marker+"\\n   if(m.paymentMethod!=null&&![\'cash\',\'card\',\'transfer\',\'unspecified\'].includes(m.paymentMethod))throw Error(\'Forma de cobro no válida\');",1)\np.write_text(store)\n(assets/\'index.html\').write_text(s.replace(\'1.0.4\',\'1.0.5\'))\n(assets/\'app.js\').write_text(core.strip()+\'\\n\')\np=assets/\'boot.js\';boot=p.read_text()\nif "await load(\'payments.js\')" not in boot:boot=boot.replace("await load(\'app.js\');", "await load(\'payments.js\');await load(\'app.js\');")\np.write_text(boot)\np=assets/\'sw.js\';sw=p.read_text().replace(\'v1.0.4\',\'v1.0.5\')\nif "\'payments.js\'" not in sw:sw=sw.replace("\'app.js\'", "\'app.js\',\'payments.js\'")\np.write_text(sw)\np=Path(\'app/build.gradle\');p.write_text(p.read_text().replace(\'versionCode 5\',\'versionCode 6\').replace("versionName \'1.0.4\'","versionName \'1.0.5\'"))\n')
          p=Path('tools/play-store/LEEME.md');p.parent.mkdir(parents=True,exist_ok=True);p.write_text('# Preparación de Control Autónomo para Google Play\n\nContacto confirmado: raulito-sp@hotmail.com. Versión preparada: 1.0.5 (5).\n\n## Solicitudes de eliminación\n\nLa aplicación ofrece una solicitud por correo, no una eliminación automática. Debes atender la bandeja de soporte y completar cada solicitud en un plazo de 30 días. No solicites contraseñas ni documentos financieros.\n\n1. Verifica la titularidad mediante una respuesta desde el correo registrado. Si el mensaje procede de otro correo, pide confirmación al correo registrado antes de borrar nada. No uses solo un UID proporcionado en el mensaje.\n2. Localiza el usuario en Firebase Authentication del proyecto `control-autonomo`. Anota su UID exacto. Comprueba con el titular que comprende que sus datos sincronizados se borrarán definitivamente y que ha exportado lo que desea conservar.\n3. Elimina el usuario de Authentication. Espera al menos 75 minutos antes del borrado final de Firestore: los tokens ya emitidos pueden vivir aproximadamente una hora y un dispositivo antiguo podría escribir con uno de ellos.\n4. Elimina TODO el árbol `users/UID` de Firestore, incluidas las subcolecciones. No basta borrar un documento padre. Con Firebase CLI autenticada como administrador, sustituye UID por el valor comprobado y ejecuta `firebase firestore:delete users/UID --recursive --project control-autonomo`. Revisa la ruta y confirma solo esa cuenta.\n5. Comprueba que ya no existen ni el usuario de Authentication ni documentos/subcolecciones bajo ese UID. Confirma la eliminación por correo. Indica al titular que borre las copias locales en los ajustes de Android de cada dispositivo y las exportaciones que ya no desee conservar. No borres datos de otras cuentas.\n6. Elimina después los mensajes de soporte cuando se cierre la solicitud, salvo obligación legal comunicada. Los sistemas internos de Firebase tienen sus propios plazos de purga, explicados en la privacidad.\n\n## Páginas públicas\n\nActiva GitHub Pages desde la rama `main` y la carpeta `/docs`. Verifica, sin iniciar sesión, que cargan:\n\n- https://obreriyo.github.io/Control-Autonomo-Android/privacidad.html\n- https://obreriyo.github.io/Control-Autonomo-Android/eliminar-cuenta.html\n\nEstos enlaces están previstos: todavía deben publicarse y comprobarse. No los declares operativos en Play Console hasta hacerlo. La privacidad también se puede consultar sin conexión desde Ajustes de la app.\n\n## Clave de carga y AAB\n\nEl flujo `publicar-play-store.yml` se detendrá hasta configurar una clave de carga privada. No uses la firma debug para publicar ni guardes contraseñas o archivos JKS en el repositorio.\n\nEn un equipo de confianza con Java, genera una clave mediante `keytool -genkeypair -keystore control-autonomo-upload.jks -alias upload -keyalg RSA -keysize 3072 -validity 10000`. Introduce la contraseña de forma interactiva. Conserva una copia privada del JKS y su contraseña. Configura los secretos de GitHub `PLAY_KEYSTORE_BASE64` (JKS convertido a base64), `PLAY_STORE_PASSWORD`, `PLAY_KEY_ALIAS` (`upload`) y `PLAY_KEY_PASSWORD`.\n\nEl flujo valida el código, compila `bundleRelease`, comprueba la firma y publica únicamente el AAB como artefacto. El JKS temporal se elimina al terminar. No se sube nada automáticamente a Google Play.\n\nLa firma de Google Play puede ser distinta de la APK debug instalada. Exporta antes tus datos de pruebas; no prometas una actualización directa de la APK debug a Play sin comprobar los certificados.\n\n## Comprobaciones antes de publicar\n\n- Compilar en GitHub la APK 1.0.5 y probar login, ojo, recuperación, modo local, PDF, copias y restauración.\n- Probar sincronización real entre dos dispositivos, incluidos conflictos y cambios sin conexión.\n- Probar Atrás y barras del sistema en Android 16 y en el móvil actual.\n- Probar Privacidad, solicitud por correo y alternativa si no hay app de correo. Abrir el correo no equivale a enviar una solicitud.\n- Probar el procedimiento de borrado con una cuenta de prueba y verificar que no afecta a otra cuenta.\n- Publicar las páginas, generar AAB firmado, completar ficha, seguridad de datos, clasificación y acceso para revisión.\n- Crear y verificar Play Console. Para cuenta personal nueva: prueba cerrada con 12 participantes inscritos 14 días consecutivos y solicitud de acceso a producción.\n\n## Seguridad de datos: borrador para revisar en Play Console\n\nLa sincronización transmite datos; no declarar «no se recopilan datos». El registro y la nube son opcionales porque existe modo local.\n\n- Información personal: correo e ID de usuario; nombre si se introduce un nombre personal en el campo negocio. Funcionalidad, gestión de cuentas y soporte.\n- Información financiera: movimientos, ingresos/gastos e importes de caja/banco que el usuario sincroniza. Revisar «Otra información financiera» y, cuando corresponda a compras registradas, «Historial de compras».\n- Mensajes: consultas enviadas voluntariamente al correo de soporte. Atención al usuario.\n- Firebase procesa IP y user-agent para seguridad y prevención de abuso. Consultar la documentación vigente del proveedor y el formulario; no declarar acceso a ubicación GPS ni publicidad que esta versión no utiliza.\n- No hay SDK de anuncios, Analytics o Crashlytics en esta versión. Firebase es proveedor de autenticación/almacenamiento; revisar la excepción de proveedores de servicios antes de responder la pregunta sobre compartir datos.\n- HTTPS para Firebase, opción de solicitar eliminación de cuenta, datos y copias sincronizadas; los archivos exportados y las copias en otros dispositivos requieren acción del titular.\n\nNo es un formulario ya presentado ni una aprobación de Google. Revisar categorías contra el AAB final y su comportamiento.\n\n## Formas de cobro (1.0.5)\n\nCada ingreso permite elegir efectivo, tarjeta o transferencia. Los informes y PDF muestran el desglose. Los ingresos antiguos conservan su importe y quedan Sin especificar hasta clasificarlos desde Movimientos.\n\nCaja/Banco muestra cada cobro con tarjeta o transferencia automáticamente, en bruto y con la fecha del ingreso; no representa el saldo bancario real ni descuenta comisiones. Los ingresos al banco manuales representan solo traslados de efectivo. No vuelvas a registrar como traslado un cobro con tarjeta. Si quedan ingresos sin clasificar, el saldo de caja se indica como provisional.\n\nComprobar en el móvil un ingreso de cada tipo, su cambio de forma de cobro, un traslado de efectivo y el PDF antes de publicar.\n')
          p=Path('tools/play-store/FICHA.md');p.parent.mkdir(parents=True,exist_ok=True);p.write_text('# Ficha propuesta para Google Play\n\nNombre: Control Autónomo\n\nDescripción breve (72 caracteres):\nControla ingresos, gastos, caja y estimaciones de impuestos de tu negocio.\n\nDescripción completa:\n\nControl Autónomo te ayuda a organizar los ingresos y gastos de tu negocio y consultar informes mensuales y anuales.\n\nRegistra movimientos con fecha, concepto, importe y los datos fiscales que correspondan. Consulta tus ingresos, gastos y movimientos de caja/banco en una interfaz adaptada al móvil.\n\nPuedes trabajar en modo local sin crear una cuenta. Si creas una cuenta con correo y contraseña, podrás sincronizar tus datos mediante Firebase y recuperar la copia de esa cuenta en otro dispositivo compatible. Sin conexión, los cambios permanecen en la copia local hasta que pueda completarse la sincronización.\n\nIncluye exportación e importación de copias JSON, informes mensuales en PDF para guardar o compartir, ayuda integrada y bloqueo local mediante un PIN opcional. El PIN no cifra las copias exportadas.\n\nLas estimaciones de impuestos sirven para planificar y no sustituyen la revisión de un profesional ni presentan declaraciones por ti. Conserva tus justificantes y revisa los informes con tu gestor.\n\nContacto de soporte: raulito-sp@hotmail.com.\nPuedes solicitar la eliminación de tu cuenta y sus datos sincronizados desde Ajustes o mediante la página pública indicada en la ficha.\n\n# Datos de la ficha y revisión\n\n- Categoría propuesta: Finanzas.\n- Correo de contacto: raulito-sp@hotmail.com.\n- Privacidad prevista: https://obreriyo.github.io/Control-Autonomo-Android/privacidad.html\n- Eliminación prevista: https://obreriyo.github.io/Control-Autonomo-Android/eliminar-cuenta.html\n- Las dos direcciones deben publicarse y verificarse antes de introducirlas como definitivas.\n- Anuncios: esta versión no incluye SDK ni anuncios de terceros.\n- Público previsto: adultos que llevan los movimientos de un negocio. Completar el cuestionario de clasificación con el comportamiento real.\n- No declarar funciones de préstamos, inversión, banca o pagos que esta app no ofrece. Completar las declaraciones financieras de Play según el uso real de gestor de movimientos.\n- Acceso para revisión: se puede comprobar el modo local sin iniciar sesión. Preparar una cuenta de prueba sin datos personales para que Google compruebe la sincronización, si solicita credenciales. No usar tu cuenta ni poner la contraseña en el repositorio.\n- Icono de la ficha: revisar `icon-512.png`; generar y comprobar también el gráfico de funciones y capturas de la versión final, sin correos ni importes personales.\n- Pendiente: gráficos finales, capturas, formulario de seguridad de datos, cuenta de desarrollador verificada y prueba cerrada si aplica.\n\n# Comprobación de afirmaciones\n\nEl acceso y el ojo han sido confirmados por el usuario. Los tests de simulación comprueban sincronización, conflictos, aislamiento, cambios sin conexión y recuperación de contraseña. Aún hace falta comprobar entre dos dispositivos reales el flujo completo y verificar restauración, PDF y navegación en Android 16. La descripción no debe publicarse hasta que esas funciones estén comprobadas con el AAB final.\n\nRegistra cobros en efectivo, tarjeta o transferencia y consulta su desglose en los informes y PDF.\n')
