      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Actualizar web y comprobar
        run: |
          node tools/prepare-web.cjs
          node tests/verify.cjs
          node tests/sync.cjs
          node tests/payments.cjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Recuperar firma debug configurada
        env:
          DEBUG_KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$DEBUG_KEYSTORE" | base64 --decode > "$HOME/.android/debug.keystore"
          fi
      - name: Compilar APK de pruebas
        run: gradle :app:assembleDebug --stacktrace
      - name: Guardar cambios comprobados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .gitignore app/build.gradle app/src/main/AndroidManifest.xml app/src/main/java/com/miscuentas/pro/MainActivity.java app/src/main/assets web docs tools/play-store tests/sync.cjs tests/payments.cjs tests/verify.cjs
          if ! git diff --cached --quiet; then
            git commit -m "Añadir formas de cobro e informes en Control Autónomo 1.0.5"
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Control-Autonomo-1.0.5-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
