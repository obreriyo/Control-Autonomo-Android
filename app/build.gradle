plugins { id 'com.android.application' }

android {
    namespace 'com.obreriyo.controlautonomo'
    compileSdk 35

    defaultConfig {
        applicationId 'com.obreriyo.controlautonomo'
        minSdk 24
        targetSdk 35
        versionCode 38
        versionName '1.7.3'
    }
}

android { compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 } }

dependencies { implementation "androidx.webkit:webkit:1.12.1" }

// Upload-key credentials come from the build environment, never from git.
android {
    signingConfigs {
        release {
            if (System.getenv('PLAY_STORE_FILE')) {
                storeFile file(System.getenv('PLAY_STORE_FILE'))
                storePassword System.getenv('PLAY_STORE_PASSWORD')
                keyAlias System.getenv('PLAY_KEY_ALIAS')
                keyPassword System.getenv('PLAY_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            debuggable false
        }
    }
}
