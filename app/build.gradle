plugins { id 'com.android.application' }

android {
    namespace 'com.obreriyo.controlautonomo'
    compileSdk 36

    defaultConfig {
        applicationId 'com.obreriyo.controlautonomo'
        minSdk 24
        targetSdk 36
        versionCode 40
        versionName '1.8.0'
    }
    buildFeatures { buildConfig true }
    buildTypes {
        debug { buildConfigField 'boolean', 'PLAY_DISTRIBUTION', 'false' }
        release { buildConfigField 'boolean', 'PLAY_DISTRIBUTION', 'true' }
    }
}

android { compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 } }

dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation "androidx.webkit:webkit:1.12.1"
    implementation "com.android.billingclient:billing:9.1.0"
}

// Upload-key credentials come from the build environment, never from git.
android {
    signingConfigs {
        release {
            if (System.getenv('PLAY_STORE_FILE')) {
                storeFile file(System.getenv('PLAY_STORE_FILE'))
                storePassword System.getenv('PLAY_STORE_PASSWORD')
                keyAlias System.getenv('PLAY_KEY_ALIAS')
                keyPassword System.getenv('PLAY_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            debuggable false
        }
    }
}

// Every debug update uses the same private key restored by GitHub Actions.
def fixedStore = new File(System.getenv('HOME'), '.android/debug.keystore')
if (System.getenv('CI') == 'true' && gradle.startParameter.taskNames.any { it.toLowerCase().contains('debug') }) {
    if (!fixedStore.isFile()) throw new GradleException('Falta la firma fija. Configura ANDROID_DEBUG_KEYSTORE_BASE64.')
    def ks = java.security.KeyStore.getInstance('JKS')
    fixedStore.withInputStream { ks.load(it, 'android'.toCharArray()) }
    def certificate = ks.getCertificate('androiddebugkey')
    def digest = certificate == null ? '' : java.security.MessageDigest.getInstance('SHA-256').digest(certificate.encoded).encodeHex().toString()
    if (digest != 'ba6a6ab18f22b25865cbbf5d4aa312b707a474b09ff1361f2f6448ae7518bef9')
        throw new GradleException('La firma no coincide con la firma fija de Control Autónomo.')
}
android {
    signingConfigs {
        controlFixed {
            storeFile fixedStore
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes { debug { signingConfig signingConfigs.controlFixed } }
}
