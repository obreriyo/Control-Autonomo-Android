name: Preparar Control Autónomo 1.8.0 para Google Play
on:
  workflow_dispatch:
    inputs:
      publicar_privacidad:
        description: Publicar privacidad (Pages debe estar configurado para GitHub Actions)
        type: boolean
        required: false
        default: false
permissions:
  contents: write
concurrency:
  group: control-autonomo-publicacion
  cancel-in-progress: false
jobs:
  preparar:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Aplicar código y recursos comprobados
        env:
          CA_PAYLOAD_000: ""
          CA_PAYLOAD_001: ""
          CA_PAYLOAD_002: ""
          CA_PAYLOAD_003: ""
          CA_PAYLOAD_004: ""
          CA_PAYLOAD_005: ""
          CA_PAYLOAD_006: ""
          CA_PAYLOAD_007: ""
          CA_PAYLOAD_008: ""
          CA_PAYLOAD_009: ""
          CA_PAYLOAD_010: ""
          CA_PAYLOAD_011: ""
          CA_PAYLOAD_012: ""
          CA_PAYLOAD_013: ""
          CA_PAYLOAD_014: ""
          CA_PAYLOAD_015: ""
          CA_PAYLOAD_016: ""
          CA_PAYLOAD_017: ""
          CA_PAYLOAD_018: ""
          CA_PAYLOAD_019: ""
          CA_PAYLOAD_020: ""
          CA_PAYLOAD_021: ""
          CA_PAYLOAD_022: ""
        run: |
          python3 - <<'PY'
          import base64,gzip,hashlib,json,os
          from pathlib import Path
          chunks=[os.environ[k] for k in sorted(os.environ) if k.startswith('CA_PAYLOAD_')]
          blob=base64.b64decode(''.join(chunks),validate=True)
          if hashlib.sha256(blob).hexdigest()!='a083aed3f48dac45522213d88251d4a0737e44c5ba307f8a0d4d4764614cad42':raise SystemExit('El paquete está incompleto.')
          for item in json.loads(gzip.decompress(blob)):
              name=item['path'];p=Path(name)
              if p.is_absolute() or '..' in p.parts or name.startswith('.github/'):raise SystemExit('Ruta no válida.')
              if item.get('delete'):
                  if name!='app/src/main/java/com/miscuentas/pro/MainActivity.java':raise SystemExit('Borrado no válido.')
                  p.unlink(missing_ok=True);continue
              data=base64.b64decode(item['data'],validate=True)
              if hashlib.sha256(data).hexdigest()!=item['sha256']:raise SystemExit('Archivo incompleto: '+name)
              p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(data)
          print('Código y recursos 1.8.0 aplicados.')
          PY
      - run: npm install --no-save --package-lock=false jsdom@26 playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Verificar cálculos, copias, interfaz y acceso Pro
        run: |
          node --test functions/test/policy.test.cjs
          node tests/verify.cjs
          node tests/payments.cjs
          node tests/sync.cjs
          node tests/play-release-browser.cjs
          node tests/tablet-plans-browser.cjs
          node tests/regressions-1-7-3.cjs
          node tests/regressions-1-7-4.cjs
          node tests/backups-1-7-2.cjs
          node tests/tpv-client-search-browser.cjs
          node tests/pro-business-browser.cjs
          node tests/employees-browser.cjs
      - name: Generar capturas con datos ficticios
        run: node tools/play-store/capturas.cjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compilar Java y revisar Android
        run: gradle :app:compileReleaseJavaWithJavac :app:lintRelease --stacktrace
      - name: Guardar correcciones en el repositorio
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app web functions docs tests tools/play-store .gitignore build.gradle firebase.json firestore.rules
          if git diff --cached --quiet; then
            echo 'El código 1.8.0 ya estaba aplicado.'
          else
            git commit -m 'Preparar Control Autónomo 1.8.0 para Google Play'
            git push origin HEAD:main
          fi
      - name: Recuperar firmas privadas si están configuradas
        id: firmas
        env:
          PLAY_JSON: ${{ secrets.ANDROID_PLAY_SIGNING_JSON }}
          DEBUG_KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import os,json,base64
          from pathlib import Path
          raw=os.environ.get('PLAY_JSON','');debug=os.environ.get('DEBUG_KEYSTORE','')
          if raw:
              d=json.loads(raw);password=d['password'];alias=d['alias']
              if any('\n' in v or '\r' in v for v in [password,alias]):raise SystemExit('Firma no válida.')
              print('::add-mask::'+password)
              p=Path(os.environ['RUNNER_TEMP'])/'control-play.p12'
              p.write_bytes(base64.b64decode(d['keystore'],validate=True));p.chmod(0o600)
              with open(os.environ['GITHUB_ENV'],'a') as f:
                  for k,v in [('PLAY_STORE_FILE',str(p)),('PLAY_STORE_PASSWORD',password),('PLAY_KEY_PASSWORD',password),('PLAY_KEY_ALIAS',alias)]:f.write(k+'='+v+'\n')
          else:print('::warning::AAB omitido: falta el secreto ANDROID_PLAY_SIGNING_JSON. El código sí queda aplicado y comprobado.')
          if debug:
              p=Path.home()/'.android/debug.keystore';p.parent.mkdir(parents=True,exist_ok=True)
              p.write_bytes(base64.b64decode(debug,validate=True));p.chmod(0o600)
          else:print('::warning::APK de pruebas omitido: falta ANDROID_DEBUG_KEYSTORE_BASE64. No se generará otra firma.')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('play='+str(bool(raw)).lower()+'\ndebug='+str(bool(debug)).lower()+'\n')
          PY
      - name: Generar AAB firmado
        if: steps.firmas.outputs.play == 'true'
        run: |
          gradle :app:bundleRelease --stacktrace
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          p=Path('app/build/outputs/bundle/release/app-release.aab');q=p.with_suffix('.ordered.aab')
          with zipfile.ZipFile(p) as src,zipfile.ZipFile(q,'w') as dst:
              infos=src.infolist()
              if len(infos)!=len({i.filename for i in infos}):raise SystemExit('Entradas duplicadas en el AAB.')
              infos.sort(key=lambda i:(0 if i.filename=='META-INF/MANIFEST.MF' else 1 if i.filename.startswith('META-INF/') else 2,i.filename))
              for i in infos:dst.writestr(i,src.read(i.filename))
          q.replace(p)
          PY
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@v4
        if: steps.firmas.outputs.play == 'true'
        with:
          name: Control-Autonomo-1.8.0-Google-Play
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
      - name: Generar APK de pruebas con tu firma fija
        if: steps.firmas.outputs.debug == 'true'
        run: |
          gradle :app:assembleDebug --stacktrace
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: steps.firmas.outputs.debug == 'true'
        with:
          name: Control-Autonomo-1.8.0-APK-Firma-Fija
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Control-Autonomo-Ficha-y-Recursos-Play
          path: |
            tools/play-store/FICHA.md
            tools/play-store/PUBLICACION-1-8-0.md
            tools/play-store/SEGURIDAD-DATOS-1-8-0.md
            tools/play-store/recursos/
            docs/privacidad.html
            docs/eliminar-cuenta.html
      - name: Limpiar claves temporales
        if: always()
        run: rm -f "$RUNNER_TEMP/control-play.p12" "$HOME/.android/debug.keystore"
  paginas:
    if: inputs.publicar_privacidad
    needs: preparar
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
        id: deploy
