name: "Control Autónomo 1.7.4 · Corrección completa y WhatsApp"
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: control-autonomo-actualizacion
  cancel-in-progress: false
jobs:
  actualizar:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Aplicar actualización 1.7.4
        run: |
          python3 - <<'PYUPDATE'
          import base64,gzip,json,hashlib
          from pathlib import Path
          payload=json.loads(gzip.decompress(base64.b64decode('')))
          for name,item in payload.items():
           p=Path(name);new=base64.b64decode(item['body']);old=p.read_bytes() if p.exists() else None
           if old!=new and (hashlib.sha256(old).hexdigest() if old is not None else None) not in item['old']:raise SystemExit('El archivo cambió: '+name+'. Se detiene para conservar tus cambios.')
          for name,item in payload.items():
           p=Path(name);p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(base64.b64decode(item['body']))
          print('Actualización 1.7.4 aplicada. Archivos:',len(payload))
          PYUPDATE
          node tools/prepare-web.cjs
          node --check app/src/main/assets/store.js
          node --check app/src/main/assets/cloud.js
          node --check app/src/main/assets/agenda-week.js
      - name: Instalar herramientas de comprobación
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2 jsdom@30.1.2
          npx playwright install --with-deps chromium
      - name: Comprobar datos, ventas, agenda y móvil/tablet
        run: |
          mkdir -p test-results delivery
          node tests/verify.cjs
          node tests/payments.cjs
          node tests/sync.cjs
          node tests/employees.cjs
          node tests/pro-business.cjs
          node tests/tpv.cjs
          node tests/tpv-partial.cjs
          node tests/improvements-core.cjs
          node tests/sync-codec.cjs
          node tests/agenda.cjs
          node tests/agenda-contacts.cjs
          node tests/agenda-delete.cjs
          node tests/agenda-customer.cjs
          node tests/agenda-calendar.cjs
          node tests/agenda-custom-service.cjs
          node tests/agenda-hours.cjs
          node tests/agenda-overlap.cjs
          TZ=Europe/Madrid node tests/regressions-1-7-1.cjs
          node tests/backups-1-7-2.cjs
          node tests/appointment-actions-1-7-2.cjs
          node tests/employees-browser.cjs
          node tests/pro-business-browser.cjs
          node tests/tpv-browser.cjs
          node tests/tablet-plans-browser.cjs
          node tests/agenda-browser.cjs
          node tests/agenda-contacts-browser.cjs
          node tests/agenda-manual-browser.cjs
          node tests/agenda-confirm-browser.cjs
          node tests/agenda-customer-browser.cjs
          node tests/agenda-calendar-browser.cjs
          node tests/agenda-week-browser.cjs
          node tests/agenda-navigation-browser.cjs
          node tests/agenda-custom-service-browser.cjs
          node tests/agenda-hours-browser.cjs
          node tests/agenda-overlap-browser.cjs
          node tests/agenda-refinements-browser.cjs
          node tests/catalogue-dom.cjs
          node tests/tpv-partial-dom.cjs
          node tests/improvements-dom.cjs
          node tests/improvements-browser.cjs
          node tests/regressions-browser-1-7-1.cjs
          node tests/agenda-simple-dom.cjs
          node tests/agenda-simple-browser.cjs
          node tests/agenda-paging-dom.cjs
          node tests/agenda-paging-browser.cjs
          node tests/agenda-fullscreen-browser.cjs
          node tests/agenda-scroll-dom.cjs
          node tests/agenda-scroll-browser.cjs
          node tests/regressions-1-7-3.cjs
          node tests/regressions-browser-1-7-3.cjs
          node tests/randomized-tpv-1-7-3.cjs
          node tests/regressions-1-7-4.cjs
      - name: Guardar resultados de interfaz
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Comprobaciones-Control-Autonomo-1.7.4
          path: test-results
          if-no-files-found: ignore
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar SDK Android
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Recuperar firma debug
        env:
          DEBUG_KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$DEBUG_KEYSTORE" || { echo "Falta ANDROID_DEBUG_KEYSTORE_BASE64"; exit 1; }
          mkdir -p "$HOME/.android"
          printf '%s' "$DEBUG_KEYSTORE" | base64 --decode > "$HOME/.android/debug.keystore"
          keytool -exportcert -alias androiddebugkey -keystore "$HOME/.android/debug.keystore" -storepass android -file /tmp/control-cert.der
          echo 'ba6a6ab18f22b25865cbbf5d4aa312b707a474b09ff1361f2f6448ae7518bef9  /tmp/control-cert.der' | sha256sum --check
      - name: Compilar APK 1.7.4
        run: gradle --no-configuration-cache --no-build-cache --rerun-tasks :app:clean :app:assembleDebug --stacktrace
      - name: Verificar firma del APK
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | tee /tmp/control-signature.txt
          grep -F 'Signer #1 certificate SHA-256 digest: ba6a6ab18f22b25865cbbf5d4aa312b707a474b09ff1361f2f6448ae7518bef9' /tmp/control-signature.txt
      - name: Guardar cambios comprobados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle app/src/main/assets/agenda-week.js app/src/main/assets/index.html app/src/main/assets/store.js tests/appointment-actions-1-7-2.cjs tests/regressions-1-7-3.cjs tests/regressions-1-7-4.cjs tests/regressions-browser-1-7-3.cjs web/agenda-week.js web/index.html web/store.js
          if ! git diff --cached --quiet; then
            git commit -m "Corregir almacenamiento, cuentas, agenda y WhatsApp 1.7.4"
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Control-Autonomo-1.7.4-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
