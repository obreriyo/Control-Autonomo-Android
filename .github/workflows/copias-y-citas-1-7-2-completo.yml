name: "Control Autónomo 1.7.2 · Copias y citas · Paquete completo"
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Aplicar actualización completa 1.7.2
        run: |
          python3 - <<'PYUPDATE'
          import base64,gzip,json,hashlib
          from pathlib import Path
          payload=json.loads(gzip.decompress(base64.b64decode('')))
          for name,item in payload.items():
           p=Path(name);new=base64.b64decode(item['body']);old=p.read_bytes() if p.exists() else None
           if old!=new and (hashlib.sha256(old).hexdigest() if old is not None else None) not in item['old']:raise SystemExit('El archivo cambió: '+name+'. Se detiene para conservar tus cambios.')
          for name,item in payload.items():
           p=Path(name);p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(base64.b64decode(item['body']))
          from html.parser import HTMLParser
          class Buttons(HTMLParser):
           handlers=[]
           def handle_starttag(self,t,a):
            for k,v in a:
             if k=='onclick':self.handlers.append(v)
          b=Buttons();b.feed(Path('app/src/main/assets/index.html').read_text());Path('/tmp/button-handlers.json').write_text(json.dumps(b.handlers))
          PYUPDATE
          node tools/prepare-web.cjs
          node -e "const fs=require('fs');for(const h of JSON.parse(fs.readFileSync('/tmp/button-handlers.json')))new Function(h);console.log('Botones correctos')"
      - name: Comprobar ventas, descuentos, IVA, stock y datos
        run: |
          node tests/verify.cjs
          node tests/payments.cjs
          node tests/sync.cjs
          node tests/employees.cjs
          node tests/pro-business.cjs
          node tests/tpv.cjs
          node tests/tpv-partial.cjs
          node tests/improvements-core.cjs
          node tests/sync-codec.cjs
          node tests/agenda.cjs
          node tests/agenda-contacts.cjs
          node tests/agenda-delete.cjs
          node tests/agenda-customer.cjs
          node tests/agenda-calendar.cjs
          node tests/agenda-custom-service.cjs
          node tests/agenda-hours.cjs
          node tests/agenda-overlap.cjs
          node --check app/src/main/assets/tpv-core.js
          node --check app/src/main/assets/tpv-ui.js
          node --check app/src/main/assets/agenda-ui.js
          node --check app/src/main/assets/agenda-calendar.js
          node --check app/src/main/assets/agenda-week.js
      - name: Comprobar TPV e interfaz móvil
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2 jsdom@30.1.2
          TZ=Europe/Madrid node tests/regressions-1-7-1.cjs
          node tests/backups-1-7-2.cjs
          node tests/appointment-actions-1-7-2.cjs
          npx playwright install --with-deps chromium
          mkdir -p delivery test-results
          node tests/employees-browser.cjs
          node tests/pro-business-browser.cjs
          node tests/tpv-browser.cjs
          node tests/tablet-plans-browser.cjs
          node tests/agenda-browser.cjs
          node tests/agenda-contacts-browser.cjs
          node tests/agenda-manual-browser.cjs
          node tests/agenda-confirm-browser.cjs
          node tests/agenda-customer-browser.cjs
          node tests/agenda-calendar-browser.cjs
          node tests/agenda-week-browser.cjs
          node tests/agenda-navigation-browser.cjs
          node tests/agenda-custom-service-browser.cjs
          node tests/agenda-hours-browser.cjs
          node tests/agenda-overlap-browser.cjs
          node tests/agenda-refinements-browser.cjs
          node tests/catalogue-dom.cjs
          node tests/tpv-partial-dom.cjs
          node tests/improvements-dom.cjs
          node tests/improvements-browser.cjs
          node tests/regressions-browser-1-7-1.cjs
          node tests/agenda-simple-dom.cjs
          node tests/agenda-simple-browser.cjs
          node tests/agenda-paging-dom.cjs
          node tests/agenda-paging-browser.cjs
          node tests/agenda-fullscreen-browser.cjs
          node tests/agenda-scroll-dom.cjs
          node tests/agenda-scroll-browser.cjs
      - name: Guardar resultados de interfaz
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Comprobaciones-Control-Autonomo-1.7.2
          path: test-results
          if-no-files-found: ignore
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar SDK Android
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Recuperar firma debug
        env:
          DEBUG_KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$DEBUG_KEYSTORE" | base64 --decode > "$HOME/.android/debug.keystore"
          fi
      - name: Compilar actualización
        run: gradle :app:assembleDebug --stacktrace
      - name: Guardar cambios comprobados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle app/src/main/java/com/miscuentas/pro/MainActivity.java app/src/main/assets/app.js app/src/main/assets/boot.js app/src/main/assets/cloud.js app/src/main/assets/index.html app/src/main/assets/plans.js app/src/main/assets/pro-business.js app/src/main/assets/sw.js app/src/main/assets/tpv-core.js app/src/main/assets/tpv-ui.js app/src/main/assets/agenda-core.js app/src/main/assets/agenda-ui.js app/src/main/assets/backups.js app/src/main/assets/sync-codec.js app/src/main/assets/agenda-calendar.js web/app.js web/boot.js web/cloud.js web/index.html web/plans.js web/pro-business.js web/sw.js web/tpv-core.js web/tpv-ui.js web/agenda-core.js web/agenda-ui.js web/backups.js web/sync-codec.js web/agenda-calendar.js tests/agenda-calendar-browser.cjs tests/payments.cjs tests/pro-business.cjs tests/sync.cjs tests/sync-codec.cjs tests/improvements-core.cjs tests/improvements-dom.cjs tests/helpers/app-dom.cjs tests/improvements-browser.cjs tests/agenda-refinements-browser.cjs tests/agenda-browser.cjs tests/agenda-contacts-browser.cjs tests/agenda-fullscreen-browser.cjs tests/agenda-custom-service-browser.cjs tests/tpv-browser.cjs tests/agenda-paging-browser.cjs tests/agenda-hours-browser.cjs tests/agenda-confirm-browser.cjs tests/agenda-customer-browser.cjs tests/tpv-client-search-browser.cjs tests/agenda-navigation-browser.cjs tests/agenda-week-browser.cjs tests/agenda-scroll-browser.cjs tests/agenda-manual-browser.cjs tests/tablet-plans-browser.cjs tests/pro-business-browser.cjs tests/employees-browser.cjs tests/agenda-simple-browser.cjs tests/agenda-overlap-browser.cjs tests/regressions-1-7-1.cjs tests/regressions-browser-1-7-1.cjs tests/backups-1-7-2.cjs tests/appointment-actions-1-7-2.cjs app/src/main/assets/agenda-week.js web/agenda-week.js
          if ! git diff --cached --quiet; then
            git commit -m "Corregir seis casos de agenda, cancelaciones, fecha local y navegación 1.7.2"
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Control-Autonomo-1.7.2-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
