name: Añadir ojo a la contraseña

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Añadir botón y actualizar versión
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('app/src/main/assets/index.html')
          s = p.read_text()
          old = '<input id="authPassword" type="password" autocomplete="current-password" minlength="6" placeholder="Al menos 6 caracteres">'
          new = '''<div style="position:relative">
          <input id="authPassword" type="password" autocomplete="current-password" minlength="6" placeholder="Al menos 6 caracteres" style="padding-right:56px">
          <button id="passwordEye" type="button" aria-label="Mostrar contraseña" aria-controls="authPassword" aria-pressed="false"
          style="position:absolute;right:4px;top:6px;width:44px;height:44px;border:0;border-radius:10px;background:transparent;color:#5f6874;cursor:pointer;display:grid;place-items:center"
          onclick="const p=document.getElementById('authPassword');const show=p.type==='password';p.type=show?'text':'password';this.setAttribute('aria-pressed',String(show));this.setAttribute('aria-label',show?'Ocultar contraseña':'Mostrar contraseña');this.querySelector('line').style.display=show?'':'none';">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/>
          <circle cx="12" cy="12" r="3"/>
          <line x1="3" y1="3" x2="21" y2="21" style="display:none"/>
          </svg></button></div>'''

          if 'id="passwordEye"' not in s:
              if old not in s:
                  raise SystemExit('No se encuentra el campo de contraseña; no se han guardado cambios.')
              s = s.replace(old, new, 1)

          p.write_text(s.replace('1.0.2', '1.0.3'))

          p = Path('app/src/main/assets/sw.js')
          p.write_text(p.read_text().replace('v1.0.2', 'v1.0.3'))

          p = Path('app/build.gradle')
          s = p.read_text()
          s = s.replace('versionCode 3', 'versionCode 4')
          s = s.replace("versionName '1.0.2'", "versionName '1.0.3'")
          p.write_text(s)
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Actualizar web y verificar
        run: |
          node tools/prepare-web.cjs
          node tests/verify.cjs

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Recuperar firma si está configurada
        env:
          DEBUG_KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$DEBUG_KEYSTORE" | base64 --decode > "$HOME/.android/debug.keystore"
          fi

      - name: Compilar APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Guardar mejora
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle app/src/main/assets web
          if ! git diff --cached --quiet; then
            git commit -m "Añadir ojo para mostrar y ocultar contraseña"
            git push
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Control-Autonomo-1.0.3-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
