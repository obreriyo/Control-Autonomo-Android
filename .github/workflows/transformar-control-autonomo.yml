name: Transformar Control Autónomo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  transformar:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ejecutar transformación validada
        run: |
          git show 6e8ed285df0d46b8b44fc4379140d5846850d44e:.github/workflows/transformar-control-autonomo.yml > /tmp/workflow-validado.yml

          awk '
            /python3 - <</ {copiar=1; next}
            copiar && /^          PY$/ {exit}
            copiar {
              sub(/^          /,"")
              print
            }
          ' /tmp/workflow-validado.yml > /tmp/transform.py

          test -s /tmp/transform.py
          python3 /tmp/transform.py

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validar Control Autónomo
        run: node tests/verify.cjs

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Evitar modificación de workflows
        run: |
          git restore .github/workflows/android.yml

      - name: Guardar Control Autónomo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -u

          if git diff --cached --quiet; then
            echo "No hay cambios pendientes."
          else
            git commit -m "Transformar proyecto en Control Autónomo"
            git push
          fi

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Control-Autonomo-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
