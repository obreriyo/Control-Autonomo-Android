name: Activar cuentas Control Autónomo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Conectar Firebase
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, json, shutil

          p = Path("app/src/main/assets")
          original = "b9923be9ec52fe604033f3c3805898f8cd104042"
          s = subprocess.check_output(
              ["git", "show", original + ":app/src/main/assets/cloud.js"],
              text=True
          )
          s = s.replace("MCPStore", "CAStore")
          s = s.replace("mcp_v2_backup_", "ca_v1_backup_")
          s = s.replace("Mis_Cuentas_recuperacion.json", "Control_Autonomo_recuperacion.json")

          config = {
              "apiKey": "AIzaSyAMkHthPoYY2pBRqLG3-018pYkSjpC4s1c",
              "authDomain": "control-autonomo.firebaseapp.com",
              "projectId": "control-autonomo",
              "storageBucket": "control-autonomo.firebasestorage.app",
              "messagingSenderId": "503758629998",
              "appId": "1:503758629998:web:68a4d19db447fa05374a7f"
          }
          lines = s.splitlines()
          lines[1] = "const firebaseConfig=" + json.dumps(config) + ";"
          s = "\n".join(lines) + "\n"

          s = s.replace(
              "if(!email||!password)throw Error('Introduce correo y contraseña.');",
              "if(action==='reset'){if(!email)throw Error('Introduce tu correo electrónico.');await auth.sendPasswordResetEmail(email);$('authMessage').textContent='Si existe una cuenta con ese correo, recibirás un enlace para cambiar la contraseña. Revisa también spam.';return;}\n  if(!email||!password)throw Error('Introduce correo y contraseña.');"
          )
          (p / "cloud.js").write_text(s)

          for name in ["index.html", "app.js"]:
              s = (p / name).read_text()
              s = s.replace("mis_cuentas_pro_copia.json", "control_autonomo_copia.json")
              if name == "index.html":
                  if "Olvidé mi contraseña" not in s:
                      s = s.replace(
                          '</fieldset></div><div id="signedIn"',
                          '<button class="secondary" onclick="accountAction(\'reset\')">Olvidé mi contraseña</button></fieldset></div><div id="signedIn"'
                      )
                  if '<script src="vendor/firebase-app-compat.js">' not in s:
                      sdk = "".join(
                          '<script src="vendor/' + n + '"></script>'
                          for n in [
                              "firebase-app-compat.js",
                              "firebase-auth-compat.js",
                              "firebase-firestore-compat.js"
                          ]
                      )
                      s = s.replace(
                          '<script src="cloud.js"></script>',
                          sdk + '<script src="cloud.js"></script>'
                      )
                  s = s.replace(
                      "Esta versión trabaja en modo local: guarda los registros en este dispositivo y no los sincroniza automáticamente con otro móvil u ordenador. Para trasladarlos, exporta una copia JSON e impórtala en el otro dispositivo.",
                      "Sin cuenta, los datos quedan en este dispositivo. Con una cuenta, se sincronizan al conectar. Usa el mismo correo en ambos dispositivos. Para llevar los registros locales a tu cuenta, pulsa Copiar datos del modo local a esta cuenta. Si hay cambios distintos en ambos dispositivos, la app te pedirá elegir una copia y conservará una copia de recuperación."
                  )
                  s = s.replace("1.0.1", "1.0.2")
              (p / name).write_text(s)

          f = p / "boot.js"
          s = f.read_text().replace(
              "await load('app.js');await load('cloud.js');",
              "await load('app.js');for(const n of ['firebase-app-compat.js','firebase-auth-compat.js','firebase-firestore-compat.js'])await load('vendor/'+n);await load('cloud.js');"
          )
          f.write_text(s)

          f = p / "sw.js"
          f.write_text(f.read_text().replace("1.0.1", "1.0.2"))

          f = Path("app/build.gradle")
          s = f.read_text().replace("versionCode 2", "versionCode 3")
          f.write_text(s.replace("1.0.1", "1.0.2"))

          for name in ["index.html", "app.js", "cloud.js", "boot.js", "sw.js"]:
              shutil.copy2(p / name, Path("web") / name)
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validar archivos
        run: node tests/verify.cjs

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Recuperar firma configurada
        env:
          DEBUG_KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$DEBUG_KEYSTORE" | base64 --decode > "$HOME/.android/debug.keystore"
          fi

      - name: Compilar APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle app/src/main/assets web
          if ! git diff --cached --quiet; then
            git commit -m "Conectar cuentas Control Autónomo con Firebase"
            git push
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Control-Autonomo-1.0.2-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
