          p=Path('tools/play-store/FICHA.md');p.parent.mkdir(parents=True,exist_ok=True);p.write_text('# Ficha propuesta para Google Play\n\nNombre: Control Autónomo\n\nDescripción breve (72 caracteres):\nControla ingresos, gastos, caja y estimaciones de impuestos de tu negocio.\n\nDescripción completa:\n\nControl Autónomo te ayuda a organizar los ingresos y gastos de tu negocio y consultar informes mensuales y anuales.\n\nRegistra movimientos con fecha, concepto, importe y los datos fiscales que correspondan. Consulta tus ingresos, gastos y movimientos de caja/banco en una interfaz adaptada al móvil.\n\nPuedes trabajar en modo local sin crear una cuenta. Si creas una cuenta con correo y contraseña, podrás sincronizar tus datos mediante Firebase y recuperar la copia de esa cuenta en otro dispositivo compatible. Sin conexión, los cambios permanecen en la copia local hasta que pueda completarse la sincronización.\n\nIncluye exportación e importación de copias JSON, informes mensuales en PDF para guardar o compartir, ayuda integrada y bloqueo local mediante un PIN opcional. El PIN no cifra las copias exportadas.\n\nLas estimaciones de impuestos sirven para planificar y no sustituyen la revisión de un profesional ni presentan declaraciones por ti. Conserva tus justificantes y revisa los informes con tu gestor.\n\nContacto de soporte: raulito-sp@hotmail.com.\nPuedes solicitar la eliminación de tu cuenta y sus datos sincronizados desde Ajustes o mediante la página pública indicada en la ficha.\n\n# Datos de la ficha y revisión\n\n- Categoría propuesta: Finanzas.\n- Correo de contacto: raulito-sp@hotmail.com.\n- Privacidad prevista: https://obreriyo.github.io/Control-Autonomo-Android/privacidad.html\n- Eliminación prevista: https://obreriyo.github.io/Control-Autonomo-Android/eliminar-cuenta.html\n- Las dos direcciones deben publicarse y verificarse antes de introducirlas como definitivas.\n- Anuncios: esta versión no incluye SDK ni anuncios de terceros.\n- Público previsto: adultos que llevan los movimientos de un negocio. Completar el cuestionario de clasificación con el comportamiento real.\n- No declarar funciones de préstamos, inversión, banca o pagos que esta app no ofrece. Completar las declaraciones financieras de Play según el uso real de gestor de movimientos.\n- Acceso para revisión: se puede comprobar el modo local sin iniciar sesión. Preparar una cuenta de prueba sin datos personales para que Google compruebe la sincronización, si solicita credenciales. No usar tu cuenta ni poner la contraseña en el repositorio.\n- Icono de la ficha: revisar `icon-512.png`; generar y comprobar también el gráfico de funciones y capturas de la versión final, sin correos ni importes personales.\n- Pendiente: gráficos finales, capturas, formulario de seguridad de datos, cuenta de desarrollador verificada y prueba cerrada si aplica.\n\n# Comprobación de afirmaciones\n\nEl acceso y el ojo han sido confirmados por el usuario. Los tests de simulación comprueban sincronización, conflictos, aislamiento, cambios sin conexión y recuperación de contraseña. Aún hace falta comprobar entre dos dispositivos reales el flujo completo y verificar restauración, PDF y navegación en Android 16. La descripción no debe publicarse hasta que esas funciones estén comprobadas con el AAB final.\n')
          PYUPDATE
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Actualizar web y comprobar
        run: |
          node tools/prepare-web.cjs
          node tests/verify.cjs
          node tests/sync.cjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Recuperar firma debug configurada
        env:
          DEBUG_KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$DEBUG_KEYSTORE" | base64 --decode > "$HOME/.android/debug.keystore"
          fi
      - name: Compilar APK de pruebas
        run: gradle :app:assembleDebug --stacktrace
      - name: Guardar cambios comprobados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .gitignore app/build.gradle app/src/main/AndroidManifest.xml app/src/main/java/com/miscuentas/pro/MainActivity.java app/src/main/assets web docs tools/play-store tests/sync.cjs
          if ! git diff --cached --quiet; then
            git commit -m "Preparar privacidad, solicitud de eliminación y firma de publicación"
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Control-Autonomo-1.0.4-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
