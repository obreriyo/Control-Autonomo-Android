name: Preparar comparativas Pro de Control Autónomo
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Añadir comparativas Pro de prueba
        run: |
          python3 - <<'PYUPDATE'
          from pathlib import Path
          import base64
          root=Path('app/src/main/assets')
          (root/'pro-reports.js').write_bytes(base64.b64decode(''))
          p=root/'index.html'
          s=p.read_text()
          if 'src="pro-reports.js"' not in s:
           s=s.replace('</body>', '<script src="pro-reports.js"></script></body>')
          p.write_text(s)
          PYUPDATE
          node tools/prepare-web.cjs
      - name: Guardar funciones nuevas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets web
          if ! git diff --cached --quiet; then
            git commit -m "Añadir vista previa de comparativas Pro"
            git push
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validar app y cálculos originales
        run: node tests/verify.cjs

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar SDK Android
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Recuperar firma debug estable si está configurada
        env:
          DEBUG_KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$DEBUG_KEYSTORE" | base64 --decode > "$HOME/.android/debug.keystore"
          else
            echo "No hay keystore estable configurado; se usará la firma debug."
          fi

      - name: Compilar y revisar Android
        run: gradle :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: Control-Autonomo-Pro-Vista-Previa-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
