name: Compilar Control Autónomo con firma fija
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Comprobar y recuperar firma fija
        env:
          FIXED_KEY: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$FIXED_KEY" ]; then
            echo 'Falta ANDROID_DEBUG_KEYSTORE_BASE64. No se generará una firma nueva.'
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$FIXED_KEY" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -exportcert -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -file /tmp/control-cert.der
          echo 'ba6a6ab18f22b25865cbbf5d4aa312b707a474b09ff1361f2f6448ae7518bef9  /tmp/control-cert.der' | sha256sum --check
      - name: Instalar SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - name: Forzar firma fija en Gradle
        run: |
          cat >> app/build.gradle <<'GRADLE'
          android {
              signingConfigs {
                  controlFixed {
                      storeFile new File(System.getenv('HOME'), '.android/debug.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
              buildTypes {
                  debug { signingConfig signingConfigs.controlFixed }
              }
          }
          GRADLE
      - name: Compilar con firma fija sin reutilizar APK
        run: gradle --no-configuration-cache --no-build-cache --rerun-tasks :app:clean :app:assembleDebug --stacktrace
      - name: Verificar firma del APK
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk > /tmp/apk-cert.txt
          cat /tmp/apk-cert.txt
          grep -F 'Signer #1 certificate SHA-256 digest: ba6a6ab18f22b25865cbbf5d4aa312b707a474b09ff1361f2f6448ae7518bef9' /tmp/apk-cert.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Control-Autonomo-FIRMA-FIJA-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
