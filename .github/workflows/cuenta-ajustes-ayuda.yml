name: Separar Mi cuenta y Ajustes y ampliar ayuda
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Aplicar actualización conjunta
        run: |
          python3 - <<'PYUPDATE'
          import base64,gzip,json,hashlib
          from pathlib import Path
          payload=json.loads(gzip.decompress(base64.b64decode('')))
          for name,item in payload.items():
           p=Path(name);new=base64.b64decode(item['body']);old=p.read_bytes()
           if old!=new and hashlib.sha256(old).hexdigest()!=item['old']:raise SystemExit('El archivo cambió: '+name+'. Se detiene para conservar tus cambios.')
          for name,item in payload.items():Path(name).write_bytes(base64.b64decode(item['body']))
          from html.parser import HTMLParser
          class Buttons(HTMLParser):
           handlers=[]
           def handle_starttag(self,t,a):
            for k,v in a:
             if k=='onclick':self.handlers.append(v)
          b=Buttons();b.feed(Path('app/src/main/assets/index.html').read_text());Path('/tmp/button-handlers.json').write_text(json.dumps(b.handlers))
          PYUPDATE
          node -e "const fs=require('fs');for(const h of JSON.parse(fs.readFileSync('/tmp/button-handlers.json')))new Function(h);console.log('Botones correctos')"
          node tools/prepare-web.cjs
      - name: Comprobar datos y cálculos
        run: |
          node tests/verify.cjs
          node tests/payments.cjs
          node tests/sync.cjs
          node tests/employees.cjs
      - name: Comprobar navegación y empleados en móvil
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium
          mkdir -p delivery
          node tests/employees-browser.cjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar SDK Android
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Recuperar firma debug
        env:
          DEBUG_KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$DEBUG_KEYSTORE" | base64 --decode > "$HOME/.android/debug.keystore"
          fi
      - name: Compilar actualización
        run: gradle :app:assembleDebug --stacktrace
      - name: Guardar cambios comprobados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle app/src/main/assets/index.html app/src/main/assets/sw.js web/index.html web/sw.js tests/employees-browser.cjs
          if ! git diff --cached --quiet; then
            git commit -m "Separar Mi cuenta y Ajustes y ampliar ayuda 1.1.1"
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Control-Autonomo-1.1.1-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
