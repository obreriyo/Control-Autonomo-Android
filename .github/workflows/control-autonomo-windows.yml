name: Control Autonomo Windows - tres instaladores
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: control-autonomo-windows
  cancel-in-progress: false
jobs:
  comprobar-app:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar programa Windows
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import base64,hashlib,json,lzma
          from pathlib import Path
          blob=base64.b64decode('')
          assert hashlib.sha256(blob).hexdigest()=='77974bec731d471b968f9043f8eb7acd6b35eaa45beee8f29e3fd7b5b0fd6573'
          content=json.loads(lzma.decompress(blob))
          for name,value in content['files'].items():
              p=Path(name)
              assert p.parts[0]=='desktop' and '..' not in p.parts and not p.is_absolute()
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_bytes(base64.b64decode(value))
          Path('windows-checks.json').write_text(json.dumps(content['commands']))
          PYTHON
      - name: Instalar herramientas de comprobacion
        run: |
          npm install --no-save jsdom@30.1.2 playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Comprobar datos, agenda, ventas, devoluciones y sincronizacion
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import json,os,shlex,subprocess
          from pathlib import Path
          errors=[]
          for command in json.loads(Path('windows-checks.json').read_text()):
              args=shlex.split(command);env=os.environ.copy()
              if args[0].startswith('TZ='):
                  env['TZ']=args.pop(0)[3:]
              print('COMPROBAR '+command,flush=True)
              if subprocess.run(args,env=env).returncode:
                  errors.append(command)
          if errors:
              raise SystemExit('No se publicaran instaladores: '+', '.join(errors))
          print('OK Las 52 comprobaciones han pasado')
          PYTHON
      - uses: actions/upload-artifact@v4
        with:
          name: Control-Autonomo-Windows-Fuentes
          path: desktop/
          include-hidden-files: true
          if-no-files-found: error
  windows:
    needs: comprobar-app
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2022
          - arch: ia32
            runner: windows-2022
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      TARGET_ARCH: ${{ matrix.arch }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Control-Autonomo-Windows-Fuentes
          path: desktop
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar herramientas Windows
        working-directory: desktop
        run: npm ci
      - name: Incorporar interfaz actual
        working-directory: desktop
        run: npm run prepare-assets
      - name: Comprobar enlaces y guardado
        working-directory: desktop
        run: npm test
      - name: Abrir programa y comprobar datos, copias y WhatsApp
        working-directory: desktop
        run: npm run test:desktop
      - name: Compilar instalador
        working-directory: desktop
        run: npm run dist -- --${{ matrix.arch }}
      - name: Verificar arquitectura real del ejecutable
        working-directory: desktop
        shell: bash
        run: |
          python - <<'PYTHON'
          import os,struct
          from pathlib import Path
          arch=os.environ['TARGET_ARCH']
          folder={'x64':'win-unpacked','ia32':'win-ia32-unpacked','arm64':'win-arm64-unpacked'}[arch]
          data=(Path('dist')/folder/'Control Autónomo.exe').read_bytes()
          assert data[:2]==b'MZ'
          start=struct.unpack_from('<I',data,60)[0]
          assert data[start:start+4]==b'PE\x00\x00'
          machine=struct.unpack_from('<H',data,start+4)[0]
          assert machine=={'x64':0x8664,'ia32':0x14c,'arm64':0xaa64}[arch]
          print('OK Arquitectura '+arch)
          PYTHON
      - name: Abrir ejecutable compilado
        working-directory: desktop
        run: node tests/packaged.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: Control-Autonomo-Windows-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            desktop/dist/*-Instalar.exe
            desktop/LEEME.txt
  guardar-version:
    needs: windows
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Control-Autonomo-Windows-Fuentes
          path: desktop
      - name: Guardar programa comprobado
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add desktop
          if ! git diff --cached --quiet; then
            git commit -m 'Añadir Control Autonomo para Windows x64, ia32 y ARM64'
            git push
          fi
